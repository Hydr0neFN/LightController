; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nologo_esp32c3_super_mini]
; pioarduino fork: official PlatformIO espressif32 is frozen at arduino-esp32
; core 2.0.17, but HomeSpan 2.1.0 requires core >= 3.3.0. This release bundles
; arduino-esp32 3.3.9 (ESP-IDF 5.5.4) and ships the nologo board natively.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = nologo_esp32c3_super_mini
framework = arduino
monitor_speed = 115200

; Default partition app slot (~1.31MB) is too small for HomeSpan+WiFi+OTA.
; min_spiffs gives ~1.9MB per app slot and keeps two OTA slots.
board_build.partitions = min_spiffs.csv

; ESP32-C3 Super Mini exposes its serial console over native USB-CDC.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; BLE presence (room-presence project): node name, publisher API, passive-only NimBLE
    -D BLE_PUBLISH_FN_API
    -D BLE_NODE_NAME=\"workdesk\"
    -D CSI_MIN_FREE_HEAP=42000
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_LOG_LEVEL=5
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0

upload_speed = 921600

lib_deps =
    homespan/HomeSpan@^2.1.0
    knolleary/PubSubClient@^2.8
    ; BLE presence scanner (src/ble_presence.cpp), passive observer
    h2zero/NimBLE-Arduino@^2.3.0
